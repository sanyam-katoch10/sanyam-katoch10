<svg width="340" height="76" viewBox="0 0 340 76" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="View Portfolio" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="panelClipD">
      <polygon points="20,4 336,4 336,56 320,72 4,72 4,20"/>
    </clipPath>
    <linearGradient id="bgGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="borderGradD" gradientUnits="userSpaceOnUse" x1="-100" y1="0" x2="150" y2="76">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
      <animate attributeName="x1" values="-340;340;-340" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-90;590;-90" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scanGradD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridD" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0 L0 0 0 14" fill="none" stroke="#ffffff" stroke-width="1"/>
    </pattern>
    <filter id="glowD" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <a href="https://sanyamportfolio.netlify.app/" target="_blank">

    <!-- glow halo -->
    <polygon points="20,4 336,4 336,56 320,72 4,72 4,20" fill="none" stroke="url(#borderGradD)" stroke-width="5" filter="url(#glowD)">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.8s" repeatCount="indefinite"/>
    </polygon>

    <!-- panel body -->
    <polygon points="20,4 336,4 336,56 320,72 4,72 4,20" fill="url(#bgGradD)" stroke="url(#borderGradD)" stroke-width="1.5"/>

    <!-- grid texture -->
    <rect x="0" y="0" width="340" height="76" fill="url(#gridD)" opacity="0.1" clip-path="url(#panelClipD)"/>

    <!-- scanline sweep -->
    <rect x="0" y="-10" width="340" height="8" fill="url(#scanGradD)" clip-path="url(#panelClipD)">
      <animate attributeName="y" values="-10;86;-10" dur="3.4s" repeatCount="indefinite"/>
    </rect>

    <!-- HUD corner brackets -->
    <path d="M318 10 H330 M330 10 V22" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M22 66 H10 M10 66 V54" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.2s" repeatCount="indefinite"/>
    </path>

    <!-- node icon: rotating ring + hex + chevron -->
    <circle cx="44" cy="40" r="19" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3 5" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" values="0 44 40;360 44 40" dur="9s" repeatCount="indefinite"/>
    </circle>
    <polygon points="58,40 51,52 37,52 30,40 37,28 51,28" fill="none" stroke="url(#borderGradD)" stroke-width="1.8"/>
    <path d="M40 31 L50 40 L40 49" fill="none" stroke="#e5f2f7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-opacity" values="1;0.5;1" dur="1.8s" repeatCount="indefinite"/>
    </path>

    <!-- label -->
    <text x="185" y="35" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="14.5" font-weight="700" fill="#e5f2f7" letter-spacing="3">VIEW PORTFOLIO</text>
    <text x="185" y="50" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="9" font-weight="500" fill="#7dd3fc" letter-spacing="2" opacity="0.75">SANYAM.DEV</text>

    <!-- terminal cursor blink -->
    <rect x="300" y="30" width="8" height="16" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
  </a>
</svg>
