<svg width="340" height="76" viewBox="0 0 340 76" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="View Portfolio" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="panelClipL">
      <polygon points="20,4 336,4 336,56 320,72 4,72 4,20"/>
    </clipPath>
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf0f8"/>
    </linearGradient>
    <linearGradient id="borderGradL" gradientUnits="userSpaceOnUse" x1="-100" y1="0" x2="150" y2="76">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
      <animate attributeName="x1" values="-340;340;-340" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-90;590;-90" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scanGradL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
    <pattern id="gridL" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0 L0 0 0 14" fill="none" stroke="#0f172a" stroke-width="1"/>
    </pattern>
    <filter id="glowL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <a href="https://sanyamportfolio.netlify.app/" target="_blank">

    <!-- glow halo -->
    <polygon points="20,4 336,4 336,56 320,72 4,72 4,20" fill="none" stroke="url(#borderGradL)" stroke-width="4" filter="url(#glowL)">
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="2.8s" repeatCount="indefinite"/>
    </polygon>

    <!-- panel body -->
    <polygon points="20,4 336,4 336,56 320,72 4,72 4,20" fill="url(#bgGradL)" stroke="url(#borderGradL)" stroke-width="1.5"/>

    <!-- grid texture -->
    <rect x="0" y="0" width="340" height="76" fill="url(#gridL)" opacity="0.06" clip-path="url(#panelClipL)"/>

    <!-- scanline sweep -->
    <rect x="0" y="-10" width="340" height="8" fill="url(#scanGradL)" clip-path="url(#panelClipL)">
      <animate attributeName="y" values="-10;86;-10" dur="3.4s" repeatCount="indefinite"/>
    </rect>

    <!-- HUD corner brackets -->
    <path d="M318 10 H330 M330 10 V22" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M22 66 H10 M10 66 V54" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </path>

    <!-- node icon: rotating ring + hex + chevron -->
    <circle cx="44" cy="40" r="19" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="3 5" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" values="0 44 40;360 44 40" dur="9s" repeatCount="indefinite"/>
    </circle>
    <polygon points="58,40 51,52 37,52 30,40 37,28 51,28" fill="none" stroke="url(#borderGradL)" stroke-width="1.8"/>
    <path d="M40 31 L50 40 L40 49" fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-opacity" values="1;0.55;1" dur="1.8s" repeatCount="indefinite"/>
    </path>

    <!-- label -->
    <text x="185" y="35" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="14.5" font-weight="700" fill="#0f172a" letter-spacing="3">VIEW PORTFOLIO</text>
    <text x="185" y="50" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" font-size="9" font-weight="500" fill="#0e7490" letter-spacing="2" opacity="0.8">SANYAM.DEV</text>

    <!-- terminal cursor blink -->
    <rect x="300" y="30" width="8" height="16" fill="#0891b2">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
    </rect>
  </a>
</svg>
