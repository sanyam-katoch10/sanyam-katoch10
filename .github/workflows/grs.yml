name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC — edit as you like
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=sanyam-katoch10&show_icons=true&theme=blue-green&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=sanyam-katoch10&layout=compact&theme=midnight-purple&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate MiniGit pin card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=sanyam-katoch10&repo=Mini-Git-Version-Control-System&theme=tokyonight&border_radius=15
          path: profile/pin-minigit.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate SegViSion pin card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=sanyam-katoch10&repo=SegViSion_PSO_Image_Segmentation_System&theme=tokyonight&border_radius=15
          path: profile/pin-segvision.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate BotShield pin card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=sanyam-katoch10&repo=BotShield_ML-CAPTCHA-Refinement-System&theme=tokyonight&border_radius=15
          path: profile/pin-botshield.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
