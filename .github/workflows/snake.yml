name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: sanyam-katoch10
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A855F7
            dist/github-snake-light.svg?palette=github-light&color_snake=#38BDF8
            dist/github-snake-neon.svg?color_snake=#22D3EE
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
